name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS – build app and test
    runs-on: macos-latest
    permissions:
      contents: write # needed to publish releases for version tags
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the build number is the commit count
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle and disk image
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NoteIt
          path: build/NoteIt-*.dmg
      - name: Screenshots
        continue-on-error: true
        run: scripts/screenshot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Release notes: the matching section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/NoteIt-*.dmg --clobber
          else
            gh release create "$TAG" build/NoteIt-*.dmg --title "NoteIt $VERSION" --notes-file build/release-notes.md
          fi

  linux:
    name: Linux – core tests
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
